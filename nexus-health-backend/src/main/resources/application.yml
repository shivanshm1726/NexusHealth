agora:
  app-id: "e75b5905a0404baea80eabe3aedafa47"
  app-certificate: "c270d3c7e1dd4c3691d40dc391b7bfd5"

spring:
  application:
    name: nexus-health-backend

  # Database
  datasource:
    url: jdbc:postgresql://localhost:5432/nexushealth
    username: ${DB_USERNAME:shivanshmishra}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:nexushealth-dev-secret-key-change-in-production-minimum-256-bits-long}
    access-token-expiration-ms: 900000      # 15 minutes
    refresh-token-expiration-ms: 604800000  # 7 days

# Razorpay Configuration
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_SmZMiBmGKl940G}
    secret: ${RAZORPAY_KEY_SECRET:78OfxMVzeETmoxHB64j1lltm}

# Server
server:
  port: 8080
  servlet:
    context-path: /api

# Logging
logging:
  level:
    com.nexushealth: DEBUG
    org.springframework.security: INFO
