agora:
  app-id: "e75b5905a0404baea80eabe3aedafa47"
  app-certificate: "c270d3c7e1dd4c3691d40dc391b7bfd5"

spring:
  application:
    name: nexus-health-backend

  # Database — uses env vars in production (Neon), falls back to local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexushealth}
    username: ${SPRING_DATASOURCE_USERNAME:shivanshmishra}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5 # keep low for free-tier DB limits

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate # Flyway manages schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:nexushealth-dev-secret-key-change-in-production-minimum-256-bits-long}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  google:
    client-id: ${GOOGLE_CLIENT_ID:282914600614-i7f7484eojmst2b0hbf61dgq7s7kojrh.apps.googleusercontent.com}

# Razorpay Configuration
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_SmZMiBmGKl940G}
    secret: ${RAZORPAY_KEY_SECRET:78OfxMVzeETmoxHB64j1lltm}

# Server — Render injects $PORT dynamically
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

# Logging
logging:
  level:
    com.nexushealth: INFO
    org.springframework.security: WARN
